{% extends 'base.html' %}

{% block content %}
<h2>Logout</h2>
<div id="logoutMessage" class="mt-3">
    Realizando logout...
</div>

<script>
async function logout() {
    const refreshToken = localStorage.getItem('refreshToken');

    try {
        // Invalidar o token de refresh no backend
        const response = await fetch('/api/logout/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
            },
            body: JSON.stringify({ refresh: refreshToken })
        });

        if (response.ok) {
            // Limpar os tokens do localStorage
            localStorage.clear();
            window.location.href = '/login/'; // Redirecionar para a página de login
        } else {
            throw new Error('Erro ao realizar logout.');
        }
    } catch (error) {
        alert(error.message);
        localStorage.clear();
        window.location.href = '/login/'; // Redirecionar para a página de login mesmo em caso de erro
    }
}

// Executar a função de logout ao carregar a página
logout();
</script>
{% endblock %}
