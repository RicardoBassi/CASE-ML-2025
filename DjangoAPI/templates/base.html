<!DOCTYPE html>
<html>
<head>
    <title>Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Prediction System</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Prediction List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/users">User Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/predictions">New Prediction</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a id="authButton" class="btn btn-outline-light" href="/login">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    let authCheckInProgress = false;

    function updateAuthButton() {
        const token = localStorage.getItem('accessToken');
        const authButton = document.getElementById('authButton');
        
        if (token) {
            authButton.href = '/logout';
            authButton.textContent = 'Logout';
        } else {
            authButton.href = '/login';
            authButton.textContent = 'Login';
        }
    }

    async function checkAuth() {
        if (/\/(login|logout)\//.test(window.location.pathname)) return;

        if (authCheckInProgress) return;
        authCheckInProgress = true;

        try {
            const token = localStorage.getItem('accessToken');
            
            if (!token) {
                throw new Error('No token found');
            }

            const response = await fetch('/api/validate-token/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token: token })
            });

            if (!response.ok) {
                throw new Error('Invalid or expired token');
            }

        } catch (error) {
            localStorage.clear();
            window.location.href = '/login';
        } finally {
            authCheckInProgress = false;
            updateAuthButton();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        updateAuthButton();
    });

    window.addEventListener('storage', () => {
        checkAuth();
        updateAuthButton();
    });
    </script>
</body>
</html>
