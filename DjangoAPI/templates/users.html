{% extends 'base.html' %}

{% block content %}
<h2>Gerenciamento de Usuários</h2>
<div class="mb-3">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addUserModal">Adicionar Usuário</button>
</div>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>E-mail</th>
            <th>Nome Completo</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="usersTable">
        <!-- Usuários populados por JavaScript -->
    </tbody>
</table>

<!-- Modal de Adicionar Usuário -->
<div class="modal fade" id="addUserModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addUserForm">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar Usuário</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="newEmail" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="newEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="newNomeCompleto" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="newNomeCompleto" required>
                    </div>
                    <div class="mb-3">
                        <label for="newTelefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="newTelefone" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="newPassword" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal de Editar Usuário -->
<div class="modal fade" id="editUserModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Usuário</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editEmail" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="editEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="editNomeCompleto" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="editNomeCompleto" required>
                    </div>
                    <div class="mb-3">
                        <label for="editTelefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="editTelefone" required>
                    </div>
                    <div class="mb-3">
                        <label for="editPassword" class="form-label">Nova Senha (opcional)</label>
                        <input type="password" class="form-control" id="editPassword">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Carregar usuários
async function loadUsers() {
    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('Você precisa estar logado para acessar esta página.');
        window.location.href = '/login';
        return;
    }

    try {
        const response = await fetch('/api/users/', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const users = await response.json();
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.email}</td>
                    <td>${user.nome_completo}</td>
                    <td>${user.telefone}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editUser(${user.id})">Editar</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">Excluir</button>
                    </td>
                </tr>
            `).join('');
        } else if (response.status === 401) {
            throw new Error('Sessão expirada. Por favor, faça login novamente.');
        } else if (response.status === 403) {
            throw new Error('Você não tem permissão para ver a lista de usuários do sistema.');
        } else {
            throw new Error('Erro ao carregar a lista de usuários.');
        }
    } catch (error) {
        alert(error.message);
        if (error.message.includes('Sessão expirada')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
}

// Formulário de adicionar usuário
document.getElementById('addUserForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('Você precisa estar logado para realizar esta ação.');
        return;
    }

    try {
        const response = await fetch('/api/users/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: document.getElementById('newEmail').value,
                nome_completo: document.getElementById('newNomeCompleto').value,
                telefone: document.getElementById('newTelefone').value,
                password: document.getElementById('newPassword').value
            })
        });

        if (response.ok) {
            document.getElementById('addUserModal').querySelector('.btn-secondary').click(); // Fecha o modal
            loadUsers(); // Recarrega a lista de usuários
        } else if (response.status === 401) {
            throw new Error('Sessão expirada. Por favor, faça login novamente.');
        } else {
            throw new Error('Apenas administradores podem criar usuários.');
        }
    } catch (error) {
        alert(error.message);
        if (error.message.includes('Sessão expirada')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
});

// Excluir usuário
async function deleteUser(userId) {
    if (!confirm('Tem certeza de que deseja excluir este usuário?')) return;

    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('Você precisa estar logado para realizar esta ação.');
        return;
    }

    try {
        const response = await fetch(`/api/users/${userId}/`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            loadUsers(); // Recarrega a lista de usuários
        } else if (response.status === 401) {
            throw new Error('Sessão expirada. Por favor, faça login novamente.');
        } else {
            throw new Error('Erro ao excluir o usuário.');
        }
    } catch (error) {
        alert(error.message);
        if (error.message.includes('Sessão expirada')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
}

// Editar usuário
async function editUser(userId) {
    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('Você precisa estar logado para realizar esta ação.');
        return;
    }

    try {
        const response = await fetch(`/api/users/${userId}/`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const user = await response.json();
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('editNomeCompleto').value = user.nome_completo;
            document.getElementById('editTelefone').value = user.telefone;

            const editModal = new bootstrap.Modal('#editUserModal');
            editModal.show();
        } else if (response.status === 401) {
            throw new Error('Sessão expirada. Por favor, faça login novamente.');
        } else {
            throw new Error('Erro ao carregar os detalhes do usuário.');
        }
    } catch (error) {
        alert(error.message);
        if (error.message.includes('Sessão expirada')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
}

// Formulário de editar usuário
document.getElementById('editUserForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const userId = document.getElementById('editUserId').value;
    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('Você precisa estar logado para realizar esta ação.');
        return;
    }

    try {
        const response = await fetch(`/api/users/${userId}/`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: document.getElementById('editEmail').value,
                nome_completo: document.getElementById('editNomeCompleto').value,
                telefone: document.getElementById('editTelefone').value,
                password: document.getElementById('editPassword').value || undefined
            })
        });

        if (response.ok) {
            bootstrap.Modal.getInstance('#editUserModal').hide(); // Fecha o modal
            loadUsers(); // Recarrega a lista de usuários
        } else if (response.status === 401) {
            throw new Error('Sessão expirada. Por favor, faça login novamente.');
        } else {
            throw new Error('Erro ao atualizar o usuário.');
        }
    } catch (error) {
        alert(error.message);
        if (error.message.includes('Sessão expirada')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
});

// Carregamento inicial
loadUsers();
</script>
{% endblock %}
